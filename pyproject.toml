[project]
name = "arkitekt-spec"
dynamic = ["version"]
description = "the wire format of an Arkitekt app: manifest, requirements, inspection, hardware selectors and deployments.yaml"
authors = [{ name = "jhnnsrs", email = "jhnnsrs@gmail.com" }]
requires-python = ">=3.11"
readme = "README.md"
license = "MIT"
# The spec is what an app is declared with and what every party reads: SDKs, the
# runtimes (arkitekt, rekuest) and the servers depend on it. So it depends on none of
# them -- no rekuest, rath, koil or fakts -- only on small pure-python packages.
# graphql-core is optional: with it installed, search queries get their full shape check.
dependencies = [
    "pydantic>=2.11",
    "pyyaml>=6",
    # The declaration layer (arkitekt_spec.declare) reads function signatures and
    # docstrings; these three are small and pure python.
    "docstring-parser>=0.11",
    "inflection>=0.5.1",
    "fieldz>=0.0.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3.5",
    "python-semantic-release>=9.21.0",
    "ruff>0.11",
    "basedpyright>=1.21",
    "types-pyyaml>=6",
    "graphql-core>=3.3.0",
    "pytest-asyncio>=1.4.0",
]

[tool.hatch.build.targets.sdist]
include = ["arkitekt_spec"]

[tool.hatch.build.targets.wheel]
include = ["arkitekt_spec"]

[tool.basedpyright]
include = ["arkitekt_spec"]
exclude = ["**/__pycache__", "tests"]
# The wire format is held to strict; the declaration layer (moved from rekuest, which
# checked it in standard mode) to standard -- see `strict` below.
typeCheckingMode = "standard"
strict = ["arkitekt_spec/*.py"]
# The opaque action-language lists are `dict[str, Any]` by design.
reportAny = false
reportExplicitAny = false

[tool.ruff.lint]
extend-select = ["ANN", "D1"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN001", "ANN201", "ANN202", "ANN206", "ANN401", "D1"]
# The declaration layer introspects arbitrary user functions, so `Any` is its
# vocabulary; its docstring coverage is rekuest's, where it came from.
"arkitekt_spec/declare/**" = [
    "ANN401", "D1", "BLE001", "TRY004", "SIM102", "SIM103", "RUF012", "C408", "PLR1704", "LOG015",
]

[tool.ruff]
line-length = 100
exclude = [".git", ".mypy_cache", ".ruff_cache", ".venv", "__pypackages__", "build", "dist", "venv"]

[tool.semantic_release]
# No version_toml/version_variables: the release version lives only in the git
# tag, which hatch-vcs reads at build time. CI runs the version command with
# `commit: false`, so PSR tags HEAD and creates the GitHub Release without
# pushing a bump commit to the branch.
#
# The semantic-release GitHub Action runs in a Docker container without uv, so
# install it first. PSR builds *before* it tags, so hatch-vcs is told the new
# version explicitly ($NEW_VERSION is injected by PSR) instead of deriving a
# `.devN+g...` local version that PyPI would reject.
build_command = """
    python -m pip install 'uv>=0.7.12'
    export SETUPTOOLS_SCM_PRETEND_VERSION="$NEW_VERSION"
    uv build
"""

# main -> stable X.Y.Z. next -> prereleases X.Y.Z-rc.N. N.x -> maintenance.
[tool.semantic_release.branches.main]
match = "main"
prerelease = false

[tool.semantic_release.branches.next]
match = "next"
prerelease = true
prerelease_token = "rc"

# Maintenance branches (1.x, 2.x, ...) cut stable patch/minor releases for an
# older major after a new major has shipped from main.
[tool.semantic_release.branches.maintenance]
match = '^\d+\.x$'
prerelease = false

# Keep the changelog focused on user-facing changes. These patterns only filter
# what's rendered -- they do not affect version bumps.
[tool.semantic_release.changelog]
exclude_commit_patterns = [
    '^chore(?:\([^)]*\))?: ',
    '^ci(?:\([^)]*\))?: ',
    '^build(?:\([^)]*\))?: ',
    '^style(?:\([^)]*\))?: ',
    '^test(?:\([^)]*\))?: ',
    '^Merge ',
]

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

# The version is derived from the nearest git tag (vX.Y.Z); nothing in the
# tree is bumped on release. Shallow CI clones see no tag and get the fallback.
[tool.hatch.version]
source = "vcs"
fallback-version = "0.0.0"
